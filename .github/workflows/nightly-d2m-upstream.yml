# Nightly D2M Upstream — builds tt-mlir at main tip (NOT the pinned SHA) and
# tt-metal at the SHA that main-tip tt-mlir itself pins, against tt-emule main.
# Warning-only: failures don't block merges. Two purposes:
#   1. Detect tt-mlir-induced D2M breakage within 24h.
#   2. Warm the GitHub Actions ccache for D2M builds (the PR D2M job is
#      currently disabled, but a re-enable or manual dispatch hits warm cache).

name: Nightly D2M Upstream

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily (one hour after pr-regression's nightly)
  workflow_dispatch: {}

concurrency:
  group: nightly-d2m-upstream
  cancel-in-progress: false

jobs:
  build:
    name: Build tt-mlir (main tip) against tt-emule main
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 240
    continue-on-error: true
    container:
      # ubuntu-24-04: ships clang-20 + gcc-13 + /opt/ttmlir-toolchain
      # pre-baked, so no runtime apt-install (and no --user root) needed.
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:latest
    outputs:
      mlir-sha:  ${{ steps.resolve.outputs.mlir }}
      metal-sha: ${{ steps.resolve.outputs.metal }}
    steps:
      - name: Checkout tt-emule (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: tt-emule

      - name: Resolve tt-mlir main tip + derived tt-metal SHA
        id: resolve
        shell: bash
        run: |
          MLIR_SHA=$(git ls-remote https://github.com/tenstorrent/tt-mlir main | awk '{print $1}')
          if [ -z "$MLIR_SHA" ]; then
            echo "::error::failed to resolve tt-mlir main tip"
            exit 1
          fi
          echo "tt-mlir main tip: $MLIR_SHA"
          METAL_SHA=$(curl -fsSL "https://raw.githubusercontent.com/tenstorrent/tt-mlir/$MLIR_SHA/third_party/CMakeLists.txt" \
              | grep 'set(TT_METAL_VERSION' \
              | sed 's/.*"\(.*\)".*/\1/' \
              | head -1)
          if [ -z "$METAL_SHA" ]; then
            echo "::error::could not extract TT_METAL_VERSION from tt-mlir@$MLIR_SHA"
            exit 1
          fi
          echo "Derived tt-metal SHA: $METAL_SHA"
          echo "mlir=$MLIR_SHA"   >> "$GITHUB_OUTPUT"
          echo "metal=$METAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout tt-mlir at resolved SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-mlir
          ref: ${{ steps.resolve.outputs.mlir }}
          path: tt-mlir
          fetch-depth: 0
          submodules: false

      - name: Checkout tt-metal at derived SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ steps.resolve.outputs.metal }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Init tt-metal submodules
        shell: bash
        working-directory: tt-metal
        run: |
          git submodule update --init --depth=1 tt_metal/third_party/umd
          git submodule update --init --depth=1 tt_metal/third_party/tracy

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: d2m-mlir-${{ steps.resolve.outputs.mlir }}-metal-${{ steps.resolve.outputs.metal }}-clang20-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            d2m-mlir-${{ steps.resolve.outputs.mlir }}-metal-${{ steps.resolve.outputs.metal }}-clang20-${{ runner.os }}-
            d2m-mlir-${{ steps.resolve.outputs.mlir }}-
            d2m-mlir-

      - name: Build
        env:
          TT_EMULE_DIR: ${{ github.workspace }}/tt-emule
          TT_MLIR_DIR:  ${{ github.workspace }}/tt-mlir
          TT_METAL_DIR: ${{ github.workspace }}/tt-metal
        shell: bash
        run: bash tt-emule/.github/scripts/ci-build-mlir.sh

      - name: Tar build trees
        shell: bash
        run: |
          tar --posix --dereference -czf d2m-build.tar.gz \
              tt-mlir/build \
              tt-metal/build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-d2m-build-${{ github.run_id }}
          path: d2m-build.tar.gz
          retention-days: 1
          if-no-files-found: error

  test:
    name: Run D2M regression (${{ matrix.arch }})
    needs: build
    runs-on: tt-ubuntu-2204-xlarge-stable
    timeout-minutes: 120
    continue-on-error: true
    container:
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:latest
    strategy:
      fail-fast: false
      matrix:
        arch: [wormhole, blackhole]
    steps:
      - name: Checkout tt-emule (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: tt-emule

      - name: Checkout tt-mlir at resolved SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-mlir
          ref: ${{ needs.build.outputs.mlir-sha }}
          path: tt-mlir
          fetch-depth: 0
          submodules: false

      - name: Checkout tt-metal at resolved SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ needs.build.outputs.metal-sha }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Init tt-metal umd submodule
        shell: bash
        working-directory: tt-metal
        run: git submodule update --init --depth=1 tt_metal/third_party/umd

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nightly-d2m-build-${{ github.run_id }}
          path: ${{ github.workspace }}

      - name: Unpack build trees
        shell: bash
        run: |
          tar -xzf d2m-build.tar.gz
          ls -la tt-mlir/build/ | head -10
          ls -la tt-metal/build/lib/ | head -10

      - name: Restore executable bits on test entry points
        shell: bash
        run: |
          chmod +x tt-metal/build/test/tt_metal/unit_tests_* 2>/dev/null || true
          chmod +x tt-metal/build/test/ttnn/unit_tests_* 2>/dev/null || true

      - name: Install ttrt wheel
        shell: bash
        run: |
          set -xeo pipefail
          ls -la tt-mlir/build/tools/ttrt/build/ 2>&1 | head -20 || true
          set +u
          cd tt-mlir
          source env/activate
          set -u
          shopt -s nullglob
          WHEELS=("$GITHUB_WORKSPACE/tt-mlir/build/tools/ttrt/build/"ttrt-*.whl)
          if [ ${#WHEELS[@]} -eq 0 ]; then
            echo "::error::ttrt wheel not found under tt-mlir/build/tools/ttrt/build/"
            exit 1
          fi
          WHEEL="${WHEELS[0]}"
          echo "Installing $WHEEL"
          pip show ttrt >/dev/null 2>&1 && pip uninstall -y ttrt || true
          pip install --force-reinstall --no-deps "$WHEEL"

      - name: Install pytest-timeout
        # run_d2m_regression.sh enforces a per-test timeout via pytest-timeout.
        # The toolchain image does not ship it, so install the tt-metal-pinned
        # version (matches tt-metal/tt_metal/python_env/requirements-dev.txt).
        shell: bash
        run: |
          set -xeo pipefail
          set +u
          cd tt-mlir
          # shellcheck disable=SC1091
          source env/activate
          set -u
          python -m pip install 'pytest-timeout==2.4.0'
          python -c 'import pytest_timeout; print("pytest_timeout OK")'

      - name: Record resolved SHAs for downstream steps
        shell: bash
        run: |
          echo "${{ needs.build.outputs.mlir-sha }}"  > tt-mlir-pin-resolved.txt
          echo "${{ needs.build.outputs.metal-sha }}" > tt-metal-pin-resolved.txt

      - name: Generate ttrt system_desc.ttsys
        env:
          TT_MLIR_DIR:   ${{ github.workspace }}/tt-mlir
          TT_METAL_DIR:  ${{ github.workspace }}/tt-metal
          BUILD_DIR:     ${{ github.workspace }}/tt-metal/build
          TT_EMULE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: bash tt-emule/.github/scripts/ci-d2m-prepare.sh

      - name: Run D2M regression
        env:
          TT_MLIR_DIR:   ${{ github.workspace }}/tt-mlir
          TT_METAL_DIR:  ${{ github.workspace }}/tt-metal
          BUILD_DIR:     ${{ github.workspace }}/tt-metal/build
          TT_EMULE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: bash tt-emule/.github/scripts/ci-d2m-regression.sh

      - name: Classify results
        env:
          BUILD_DIR: ${{ github.workspace }}/tt-metal/build
        shell: bash
        run: |
          python3 tt-emule/.github/scripts/classify-d2m-results.py \
            --xml-dir "${RUNNER_TEMP}/d2m-xml" \
            --allowlist tt-emule/.github/known-failures-d2m-${{ matrix.arch }}.txt \
            --build-dir "$BUILD_DIR"

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-d2m-regression-results-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/d2m-regression.log
            ${{ runner.temp }}/d2m-xml/*.xml
            tt-mlir-pin-resolved.txt
            tt-metal-pin-resolved.txt
          retention-days: 30
          if-no-files-found: warn
