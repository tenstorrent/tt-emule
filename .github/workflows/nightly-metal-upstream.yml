# Nightly Metal Upstream Regression — builds tt-metal at main tip (NOT the
# pinned SHA) against tt-emule main, then runs the full regression. Warning-
# only: failures do not block anything. Two purposes:
#   1. Detect tt-metal-induced breakage within 24h.
#   2. Warm the GitHub Actions ccache against the current tt-metal main, so
#      that PRs which later bump tt-metal-pin.txt to that SHA hit warm cache.
#
# Slack notification on failure is documented in .github/notify-stub.md.

name: Nightly Metal Upstream Regression

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: nightly-upstream
  cancel-in-progress: false

jobs:
  build:
    name: Build tt-metal (main tip) against tt-emule main
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 240
    continue-on-error: true
    container:
      # ubuntu-24-04: ships clang-20 + gcc-13 + /opt/ttmlir-toolchain
      # pre-baked. Same image PR Metal Regression and PR D2M Regression use.
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout tt-emule (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: tt-emule

      - name: Resolve tt-metal main tip
        id: resolve
        shell: bash
        run: |
          SHA=$(git ls-remote https://github.com/tenstorrent/tt-metal main | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "::error::failed to resolve tt-metal main tip"
            exit 1
          fi
          echo "tt-metal main tip: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout tt-metal
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ steps.resolve.outputs.sha }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Init required tt-metal submodules
        shell: bash
        run: |
          cd tt-metal
          git submodule update --init --depth=1 tt_metal/third_party/umd
          git submodule update --init --depth=1 tt_metal/third_party/tracy

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: tt-metal-${{ steps.resolve.outputs.sha }}-clang20-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tt-metal-${{ steps.resolve.outputs.sha }}-clang20-${{ runner.os }}-
            tt-metal-${{ steps.resolve.outputs.sha }}-clang20-
            tt-metal-

      - name: Build
        env:
          TT_EMULE_DIR: ${{ github.workspace }}/tt-emule
          TT_METAL_DIR: ${{ github.workspace }}/tt-metal
          BUILD_DIR:    ${{ github.workspace }}/tt-metal/build_emule
        shell: bash
        run: bash tt-emule/.github/scripts/ci-build.sh

      - name: Stage cluster descriptors with build artifact
        shell: bash
        run: |
          mkdir -p tt-metal/build_emule/_cluster_descs
          cp -r tt-metal/tt_metal/third_party/umd/tests/cluster_descriptor_examples \
                tt-metal/build_emule/_cluster_descs/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-tt-metal-build-${{ github.run_id }}
          path: tt-metal/build_emule/
          retention-days: 1
          if-no-files-found: error

  test:
    name: Run regression (${{ matrix.arch }})
    needs: build
    runs-on: tt-ubuntu-2204-xlarge-stable
    timeout-minutes: 60
    continue-on-error: true
    container:
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:latest
    strategy:
      fail-fast: false
      matrix:
        arch: [wormhole, blackhole, quasar]
    steps:
      - name: Checkout tt-emule (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: tt-emule

      - name: Checkout tt-metal at resolved SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ needs.build.outputs.sha }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nightly-tt-metal-build-${{ github.run_id }}
          path: tt-metal/build_emule/

      - name: Restore executable bits on test binaries
        # actions/upload-artifact@v4 strips Unix mode bits.
        shell: bash
        run: |
          chmod +x tt-metal/build_emule/test/tt_metal/unit_tests_* 2>/dev/null || true
          chmod +x tt-metal/build_emule/test/ttnn/unit_tests_* 2>/dev/null || true

      - name: Place cluster descriptors
        shell: bash
        run: |
          mkdir -p tt-metal/tt_metal/third_party/umd/tests
          cp -r tt-metal/build_emule/_cluster_descs/cluster_descriptor_examples \
                tt-metal/tt_metal/third_party/umd/tests/

      - name: Install SFPI toolchain
        # tt-metal's JIT kernel compiler looks for sfpi at <TT_METAL_HOME>/runtime/sfpi/
        # or /opt/tenstorrent/sfpi/. Neither is present on the fresh test-runner
        # checkout, so use tt-metal's own install_dependencies.sh --sfpi (which
        # apt-installs the released .deb under /opt/tenstorrent/sfpi/).
        shell: bash
        run: bash tt-metal/install_dependencies.sh --sfpi

      - name: Record tt-metal SHA for downstream steps
        shell: bash
        run: echo "${{ needs.build.outputs.sha }}" > tt-metal-pin-resolved.txt

      - name: Run regression
        env:
          TT_METAL_DIR:  ${{ github.workspace }}/tt-metal
          BUILD_DIR:     ${{ github.workspace }}/tt-metal/build_emule
          TT_EMULE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: bash tt-emule/.github/scripts/ci-regression.sh

      - name: Classify results
        env:
          BUILD_DIR: ${{ github.workspace }}/tt-metal/build_emule
        shell: bash
        run: |
          # wormhole/blackhole: no allowlist => every test must pass.
          # quasar: allow the documented known failures.
          allowlist=()
          if [ "${{ matrix.arch }}" = "quasar" ]; then
            allowlist=(--allowlist tt-emule/.github/known-failures-quasar.txt)
          fi
          python3 tt-emule/.github/scripts/classify-results.py \
            --xml-dir "${RUNNER_TEMP}/gtest-xml" \
            "${allowlist[@]}" \
            --build-dir "$BUILD_DIR"

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-results-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/regression.log
            ${{ runner.temp }}/gtest-xml/*.xml
            tt-metal-pin-resolved.txt
          retention-days: 30
          if-no-files-found: warn

  ttnn-pytest:
    name: TTNN Pytests (${{ matrix.arch }}, shard ${{ matrix.shard }}/4)
    needs: build
    runs-on: tt-ubuntu-2204-xlarge-stable
    timeout-minutes: 90
    continue-on-error: true
    container:
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:latest
    strategy:
      fail-fast: false
      matrix:
        arch: [wormhole, blackhole]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout tt-emule (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: tt-emule

      - name: Checkout tt-metal at resolved SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ needs.build.outputs.sha }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nightly-tt-metal-build-${{ github.run_id }}
          path: tt-metal/build_emule/

      - name: Place cluster descriptors
        shell: bash
        run: |
          mkdir -p tt-metal/tt_metal/third_party/umd/tests
          cp -r tt-metal/build_emule/_cluster_descs/cluster_descriptor_examples \
                tt-metal/tt_metal/third_party/umd/tests/

      - name: Install SFPI toolchain
        shell: bash
        run: bash tt-metal/install_dependencies.sh --sfpi

      - name: Run TTNN pytest (${{ matrix.arch }}, shard ${{ matrix.shard }}/4)
        env:
          TT_METAL_DIR:  ${{ github.workspace }}/tt-metal
          BUILD_DIR:     ${{ github.workspace }}/tt-metal/build_emule
          TT_EMULE_ARCH: ${{ matrix.arch }}
          SHARD_INDEX:   ${{ matrix.shard }}
          SHARD_COUNT:   4
        shell: bash
        run: bash tt-emule/.github/scripts/ci-ttnn-pytests.sh

      - name: Upload TTNN pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ttnn-pytests-results-${{ github.run_id }}-${{ matrix.arch }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/ttnn-pytests.log
            ${{ runner.temp }}/ttnn-junit-xml/*.xml
          retention-days: 30
          if-no-files-found: warn
