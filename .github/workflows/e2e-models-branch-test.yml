# THROWAWAY pre-merge test for the e2e-models nightly shard (PR #234).
#
# The e2e-models job only lives in nightly-metal-upstream.yml (schedule /
# workflow_dispatch), so it never runs on a PR and has never been exercised in
# an Action. This workflow proves it green from the branch BEFORE merge, then
# is deleted (it is not meant to land on main).
#
# It mirrors the nightly build + e2e-models jobs, minus the regression and
# ttnn-pytest fan-out:
#   - tt-emule is checked out at the triggering branch (github.ref), NOT main,
#     so the branch's harness scripts are what run.
#   - tt-metal is built at main tip (the companion vendored demo,
#     tests/emule/models/test_tt_transformers_text_demo.py, lives on tt-metal
#     main — it is NOT at the pinned SHA).
#
# Trigger: push to the PR branch (workflow_dispatch would require this file to
# already be on the default branch, which it is not — that is the whole point).

name: E2E Models Branch Test (throwaway)

on:
  push:
    branches:
      - mkamran/e2e-model-tests

concurrency:
  group: e2e-branch-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tt-metal (main tip) against PR's tt-emule
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 240
    container:
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout tt-emule (PR branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: tt-emule

      - name: Resolve tt-metal main tip
        id: resolve
        shell: bash
        run: |
          SHA=$(git ls-remote https://github.com/tenstorrent/tt-metal main | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "::error::failed to resolve tt-metal main tip"
            exit 1
          fi
          echo "tt-metal main tip: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout tt-metal
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ steps.resolve.outputs.sha }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Init required tt-metal submodules
        shell: bash
        run: |
          cd tt-metal
          git submodule update --init --depth=1 tt_metal/third_party/umd
          git submodule update --init --depth=1 tt_metal/third_party/tracy

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: tt-metal-${{ steps.resolve.outputs.sha }}-clang20-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tt-metal-${{ steps.resolve.outputs.sha }}-clang20-${{ runner.os }}-
            tt-metal-${{ steps.resolve.outputs.sha }}-clang20-
            tt-metal-

      - name: Build
        env:
          TT_EMULE_DIR: ${{ github.workspace }}/tt-emule
          TT_METAL_DIR: ${{ github.workspace }}/tt-metal
          BUILD_DIR:    ${{ github.workspace }}/tt-metal/build_emule
        shell: bash
        run: bash tt-emule/.github/scripts/ci-build.sh

      - name: Stage cluster descriptors with build artifact
        shell: bash
        run: |
          mkdir -p tt-metal/build_emule/_cluster_descs
          cp -r tt-metal/tt_metal/third_party/umd/tests/cluster_descriptor_examples \
                tt-metal/build_emule/_cluster_descs/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-branch-test-build-${{ github.run_id }}
          path: tt-metal/build_emule/
          retention-days: 1
          if-no-files-found: error

  e2e-models:
    name: E2E Models (${{ matrix.arch }}, shard ${{ matrix.shard }}/2)
    needs: build
    runs-on: tt-ubuntu-2204-xlarge-stable
    timeout-minutes: 300
    # NOT continue-on-error: a failure must surface loudly — that is the point.
    container:
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:latest
    strategy:
      fail-fast: false
      matrix:
        # Wormhole only for the pre-merge proof (blackhole full-model support is
        # unvalidated even in the nightly). Both shards: shard 1 = token-matching
        # accuracy gate, shard 2 = batch-1 generative smoke.
        arch: [wormhole]
        shard: [1, 2]
    steps:
      - name: Checkout tt-emule (PR branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: tt-emule

      - name: Checkout tt-metal at resolved SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ needs.build.outputs.sha }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: e2e-branch-test-build-${{ github.run_id }}
          path: tt-metal/build_emule/

      - name: Restore executable bits on test binaries
        shell: bash
        run: |
          chmod +x tt-metal/build_emule/test/tt_metal/unit_tests_* 2>/dev/null || true
          chmod +x tt-metal/build_emule/test/ttnn/unit_tests_* 2>/dev/null || true

      - name: Place cluster descriptors
        shell: bash
        run: |
          mkdir -p tt-metal/tt_metal/third_party/umd/tests
          cp -r tt-metal/build_emule/_cluster_descs/cluster_descriptor_examples \
                tt-metal/tt_metal/third_party/umd/tests/

      - name: Install SFPI toolchain
        shell: bash
        run: bash tt-metal/install_dependencies.sh --sfpi

      - name: Install model deps (transformers, torchvision — no torch bump)
        shell: bash
        run: |
          VENV=/opt/ttmlir-toolchain/venv
          "$VENV/bin/pip" install --no-cache-dir transformers==4.53.0
          "$VENV/bin/pip" install --no-cache-dir --no-deps torchvision==0.24.0

      - name: Restore HuggingFace weight cache (ungated unsloth mirror)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf-cache
          key: hf-unsloth-llama-3.2-1b-instruct-v1
          restore-keys: |
            hf-unsloth-llama-3.2-1b-

      - name: Run E2E models (${{ matrix.arch }}, shard ${{ matrix.shard }}/2)
        env:
          TT_METAL_DIR:  ${{ github.workspace }}/tt-metal
          BUILD_DIR:     ${{ github.workspace }}/tt-metal/build_emule
          TT_EMULE_ARCH: ${{ matrix.arch }}
          SHARD_INDEX:   ${{ matrix.shard }}
          SHARD_COUNT:   2
          HF_HOME:       ${{ runner.temp }}/hf-cache
        shell: bash
        run: bash tt-emule/.github/scripts/ci-e2e-models.sh

      - name: Upload E2E model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-branch-test-results-${{ github.run_id }}-${{ matrix.arch }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/e2e-models.log
            ${{ runner.temp }}/e2e-junit-xml/*.xml
          retention-days: 7
          if-no-files-found: warn
