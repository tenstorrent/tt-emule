# PR Metal Regression — builds tt-metal at the pinned SHA against the PR's
# tt-emule source, then runs the full tt-emule regression suite. Fails the PR
# if any test fails outside of .github/known-failures.txt.

name: PR Metal Regression

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'NOTICE'
  push:
    branches: [main]

concurrency:
  group: pr-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # tt-mlir's CI image: ubuntu-22-04 + pre-built /opt/ttmlir-toolchain
  # (LLVM, StableHLO, Shardy, flatbuffers). Same image PR D2M Regression uses,
  # which is why both workflows can share the same gcc-13 / clang-20 install
  # pattern below.
  TT_MLIR_CI_IMAGE: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-22-04:latest

jobs:
  build:
    name: Build tt-metal against PR's tt-emule
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 180
    container:
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-22-04:latest
      options: --user root
    outputs:
      pin: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Checkout tt-emule (PR)
        uses: actions/checkout@v4
        with:
          path: tt-emule

      - name: Resolve pinned tt-metal SHA
        id: pin
        shell: bash
        run: |
          SHA=$(grep -vE '^\s*(#|$)' tt-emule/tt-metal-pin.txt | head -1 | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "::error::tt-metal-pin.txt has no SHA"
            exit 1
          fi
          echo "Pinned tt-metal SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout tt-metal at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ steps.pin.outputs.sha }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Init required tt-metal submodules
        shell: bash
        run: |
          cd tt-metal
          git submodule update --init --depth=1 tt_metal/third_party/umd
          git submodule update --init --depth=1 tt_metal/third_party/tracy

      - name: Install clang-20 + gcc-13 libstdc++
        # tt-mlir's CI container ships clang-17 + gcc-12's libstdc++. We need
        # clang-20 (because the runtime JIT compile path uses /usr/bin/clang++-20
        # baked into libtt_metal.so) and gcc-13 (because tt-metal's C++20
        # std::ranges code in levelized_graph.cpp doesn't compile against
        # gcc-11/gcc-12 libstdc++ — see BUILD_GUIDE.md). Mirrors the D2M build
        # workflow's install step.
        shell: bash
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq wget gnupg lsb-release software-properties-common
          if ! command -v clang-20 >/dev/null 2>&1; then
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            /tmp/llvm.sh 20 all
          fi
          if [ ! -d /usr/lib/gcc/x86_64-linux-gnu/13 ]; then
            add-apt-repository -y ppa:ubuntu-toolchain-r/test
            apt-get update -qq
            apt-get install -y -qq gcc-13 g++-13 libstdc++-13-dev
          fi
          clang-20 --version
          ls /usr/lib/gcc/x86_64-linux-gnu/ | head

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: tt-metal-${{ steps.pin.outputs.sha }}-clang20-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tt-metal-${{ steps.pin.outputs.sha }}-clang20-${{ runner.os }}-
            tt-metal-${{ steps.pin.outputs.sha }}-clang20-

      - name: Build
        env:
          TT_EMULE_DIR: ${{ github.workspace }}/tt-emule
          TT_METAL_DIR: ${{ github.workspace }}/tt-metal
          BUILD_DIR:    ${{ github.workspace }}/tt-metal/build_emule
        shell: bash
        run: bash tt-emule/.github/scripts/ci-build.sh

      - name: Stage cluster descriptors with build artifact
        shell: bash
        run: |
          mkdir -p tt-metal/build_emule/_cluster_descs
          cp -r tt-metal/tt_metal/third_party/umd/tests/cluster_descriptor_examples \
                tt-metal/build_emule/_cluster_descs/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tt-metal-build-${{ github.run_id }}
          path: tt-metal/build_emule/
          retention-days: 1
          if-no-files-found: error

  test:
    name: Run regression (${{ matrix.arch }})
    needs: build
    runs-on: tt-ubuntu-2204-xlarge-stable
    timeout-minutes: 60
    container:
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-22-04:latest
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        arch: [wormhole, blackhole, quasar]
    steps:
      - name: Checkout tt-emule (PR)
        uses: actions/checkout@v4
        with:
          path: tt-emule

      - name: Checkout tt-metal at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ needs.build.outputs.pin }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: tt-metal-build-${{ github.run_id }}
          path: tt-metal/build_emule/

      - name: Restore executable bits on test binaries
        # actions/upload-artifact@v4 strips Unix mode bits — restore +x on the
        # gtest binaries that run_regression.sh invokes.
        shell: bash
        run: |
          chmod +x tt-metal/build_emule/test/tt_metal/unit_tests_* 2>/dev/null || true
          chmod +x tt-metal/build_emule/test/ttnn/unit_tests_* 2>/dev/null || true

      - name: Place cluster descriptors
        shell: bash
        run: |
          mkdir -p tt-metal/tt_metal/third_party/umd/tests
          cp -r tt-metal/build_emule/_cluster_descs/cluster_descriptor_examples \
                tt-metal/tt_metal/third_party/umd/tests/

      - name: Install clang-20 + gcc-13 libstdc++ runtime
        # clang-20 is required at *runtime*: the emulated program runner
        # (tt_metal/impl/emulation/emulated_program_runner.cpp) JIT-compiles each
        # kernel source via system(TT_EMULE_CXX_COMPILER ...). That define is
        # baked into libtt_metal.so at build time as /usr/bin/clang++-20.
        #
        # gcc-13's libstdc++ is required because the build job links against
        # GLIBCXX_3.4.32 symbols (the container ships libstdc++-12 by default).
        # Mirrors the D2M test workflow's install step.
        shell: bash
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq wget gnupg lsb-release software-properties-common
          if ! command -v clang-20 >/dev/null 2>&1; then
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            /tmp/llvm.sh 20 all
          fi
          if [ ! -d /usr/lib/gcc/x86_64-linux-gnu/13 ]; then
            add-apt-repository -y ppa:ubuntu-toolchain-r/test
            apt-get update -qq
            apt-get install -y -qq libstdc++6 gcc-13 g++-13 libstdc++-13-dev
          fi

      - name: Install SFPI toolchain
        # tt-metal's JIT kernel compiler (tt_metal/jit_build/build.cpp) looks for
        # the sfpi toolchain at either <TT_METAL_HOME>/runtime/sfpi/ or
        # /opt/tenstorrent/sfpi/. The build job fetches sfpi via CMake's
        # FetchContent into the *source tree* (runtime/sfpi/), but that path is
        # not part of the build artifact, and the test job does a fresh
        # tt-metal checkout — so it has neither. Install via tt-metal's own
        # install_dependencies.sh --sfpi which fetches the released .deb from
        # tenstorrent/sfpi and apt-installs it into /opt/tenstorrent/sfpi/,
        # matching tt-metal's own CI flow.
        shell: bash
        run: bash tt-metal/install_dependencies.sh --sfpi

      - name: Run regression
        env:
          TT_METAL_DIR:  ${{ github.workspace }}/tt-metal
          BUILD_DIR:     ${{ github.workspace }}/tt-metal/build_emule
          TT_EMULE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: bash tt-emule/.github/scripts/ci-regression.sh

      - name: Classify results
        env:
          BUILD_DIR: ${{ github.workspace }}/tt-metal/build_emule
        shell: bash
        run: |
          python3 tt-emule/.github/scripts/classify-results.py \
            --xml-dir "${RUNNER_TEMP}/gtest-xml" \
            --allowlist tt-emule/.github/known-failures-${{ matrix.arch }}.txt \
            --build-dir "$BUILD_DIR"

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/regression.log
            ${{ runner.temp }}/gtest-xml/*.xml
          retention-days: 30
          if-no-files-found: warn
