# PR Metal Regression — builds tt-metal at the pinned SHA against the PR's
# tt-emule source, then runs the full tt-emule regression suite. wormhole and
# blackhole must pass every test (zero-tolerance, no allowlist); quasar is
# allowed the failures in .github/known-failures-quasar.txt.

name: PR Metal Regression

# NOTE: no `paths`/`paths-ignore` filter here. A path filter at the workflow
# level cannot express "all changed files are docs" — `paths-ignore` skips only
# when EVERY file matches, while a sibling `paths` workflow would fire whenever
# ANY file matches, so a mixed code+docs PR would trip both and an instant
# docs-gate success could satisfy the required check before the real regression
# finished. Instead this workflow ALWAYS runs and the `changes` job below
# decides — at runtime, over the full changed-file set — whether the heavy build
# /test/ttnn jobs run. Either way the single `all-passed` check always reports,
# so docs-only PRs pass instantly and code PRs get the real result.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether the PR/push touches anything that can affect regression.
  # `code == 'false'` only when EVERY changed file is docs/agent-config/license
  # (the set the old `paths-ignore` used). Unknown bases always run the full
  # suite. The heavy jobs below gate on this output, so docs-only changes skip
  # the build but `all-passed` still reports success.
  changes:
    name: Detect non-docs changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout (full history for base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          fi
          # New branch / unknown base (all-zero SHA) → can't diff, run full.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base SHA → full suite"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"; printf '  %s\n' $changed
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|.claude/*|LICENSE*|NOTICE|.github/CODEOWNERS) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "Result: code=$code (true → run regression)"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build:
    name: Build tt-metal against PR's tt-emule
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 180
    container:
      # ubuntu-24-04: ships clang-20 + gcc-13 + /opt/ttmlir-toolchain
      # pre-baked, so the workflow doesn't need to apt-install at runtime
      # (which is why we don't need --user root).
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:latest
    outputs:
      pin: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Checkout tt-emule (PR)
        uses: actions/checkout@v4
        with:
          path: tt-emule

      - name: Resolve pinned tt-metal SHA
        id: pin
        shell: bash
        run: |
          SHA=$(grep -vE '^\s*(#|$)' tt-emule/tt-metal-pin.txt | head -1 | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "::error::tt-metal-pin.txt has no SHA"
            exit 1
          fi
          echo "Pinned tt-metal SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout tt-metal at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ steps.pin.outputs.sha }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Init required tt-metal submodules
        shell: bash
        run: |
          cd tt-metal
          git submodule update --init --depth=1 tt_metal/third_party/umd
          git submodule update --init --depth=1 tt_metal/third_party/tracy

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: tt-metal-${{ steps.pin.outputs.sha }}-clang20-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tt-metal-${{ steps.pin.outputs.sha }}-clang20-${{ runner.os }}-
            tt-metal-${{ steps.pin.outputs.sha }}-clang20-

      - name: Build
        env:
          TT_EMULE_DIR: ${{ github.workspace }}/tt-emule
          TT_METAL_DIR: ${{ github.workspace }}/tt-metal
          BUILD_DIR:    ${{ github.workspace }}/tt-metal/build_emule
        shell: bash
        run: bash tt-emule/.github/scripts/ci-build.sh

      - name: Stage cluster descriptors with build artifact
        shell: bash
        run: |
          mkdir -p tt-metal/build_emule/_cluster_descs
          cp -r tt-metal/tt_metal/third_party/umd/tests/cluster_descriptor_examples \
                tt-metal/build_emule/_cluster_descs/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tt-metal-build-${{ github.run_id }}
          path: tt-metal/build_emule/
          retention-days: 1
          if-no-files-found: error

  test:
    name: Run regression (all archs)
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: tt-ubuntu-2204-xlarge-stable
    # One runner visits wormhole/blackhole/quasar sequentially (they share a JIT
    # cache and cannot run concurrently). Folds the former 3-leg matrix into one
    # job — fewer concurrent runners, at the cost of summed wall-clock.
    timeout-minutes: 150
    container:
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:latest
    steps:
      - name: Checkout tt-emule (PR)
        uses: actions/checkout@v4
        with:
          path: tt-emule

      - name: Checkout tt-metal at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ needs.build.outputs.pin }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: tt-metal-build-${{ github.run_id }}
          path: tt-metal/build_emule/

      - name: Restore executable bits on test binaries
        # actions/upload-artifact@v4 strips Unix mode bits — restore +x on the
        # gtest binaries that run_regression.sh invokes.
        shell: bash
        run: |
          chmod +x tt-metal/build_emule/test/tt_metal/unit_tests_* 2>/dev/null || true
          chmod +x tt-metal/build_emule/test/ttnn/unit_tests_* 2>/dev/null || true

      - name: Place cluster descriptors
        shell: bash
        run: |
          mkdir -p tt-metal/tt_metal/third_party/umd/tests
          cp -r tt-metal/build_emule/_cluster_descs/cluster_descriptor_examples \
                tt-metal/tt_metal/third_party/umd/tests/

      - name: Install SFPI toolchain
        # tt-metal's JIT kernel compiler (tt_metal/jit_build/build.cpp) looks for
        # the sfpi toolchain at either <TT_METAL_HOME>/runtime/sfpi/ or
        # /opt/tenstorrent/sfpi/. The build job fetches sfpi via CMake's
        # FetchContent into the *source tree* (runtime/sfpi/), but that path is
        # not part of the build artifact, and the test job does a fresh
        # tt-metal checkout — so it has neither. Install via tt-metal's own
        # install_dependencies.sh --sfpi which fetches the released .deb from
        # tenstorrent/sfpi and apt-installs it into /opt/tenstorrent/sfpi/,
        # matching tt-metal's own CI flow.
        shell: bash
        run: bash tt-metal/install_dependencies.sh --sfpi

      - name: Run regression (all archs, sequential) + classify
        # ci-regression-all.sh loops wormhole→blackhole→quasar, writing each
        # arch's gtest XML to gtest-xml/<arch>/ and classifying per arch
        # (quasar gets the known-failures allowlist; wh/bh are zero-tolerance).
        # Exits non-zero if any arch has a new failure.
        #
        # CI_TIER controls the on-PR vs on-push split for C++:
        #   pull_request → CI_TIER=pr: blackhole (PR_FULL_ARCHES) runs its full
        #     suite; wormhole + quasar run only their PR_TIER smoke set.
        #   push / other → CI_TIER=full: every arch runs its full suite, so the
        #     on-push regression is identical to before this split.
        env:
          TT_METAL_DIR: ${{ github.workspace }}/tt-metal
          BUILD_DIR:    ${{ github.workspace }}/tt-metal/build_emule
          CI_TIER: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
        shell: bash
        run: bash tt-emule/.github/scripts/ci-regression-all.sh

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            ${{ runner.temp }}/regression-*.log
            ${{ runner.temp }}/gtest-xml/*/*.xml
          retention-days: 30
          if-no-files-found: warn

  # Keep shards serialized within each architecture to avoid overwhelming the
  # shared CPU runners while still allowing wormhole and blackhole to progress.
  #
  # The full sharded TTNN suites run on push to main (and any non-PR event), NOT
  # on pull_request — on a PR the lightweight `ttnn-smoke-pr` job below replaces
  # them. The on-push suite is therefore unchanged.
  ttnn-pytest-wormhole:
    name: TTNN Pytests (${{ matrix.arch }}, shard ${{ matrix.shard }}/5)
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' && github.event_name != 'pull_request' }}
    runs-on: tt-ubuntu-2204-xlarge-stable
    timeout-minutes: 90
    container:
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [wormhole]
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout tt-emule (PR)
        uses: actions/checkout@v4
        with:
          path: tt-emule

      - name: Checkout tt-metal at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ needs.build.outputs.pin }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: tt-metal-build-${{ github.run_id }}
          path: tt-metal/build_emule/

      - name: Place cluster descriptors
        shell: bash
        run: |
          mkdir -p tt-metal/tt_metal/third_party/umd/tests
          cp -r tt-metal/build_emule/_cluster_descs/cluster_descriptor_examples \
                tt-metal/tt_metal/third_party/umd/tests/

      - name: Install SFPI toolchain
        shell: bash
        run: bash tt-metal/install_dependencies.sh --sfpi

      - name: Run TTNN pytest (${{ matrix.arch }}, shard ${{ matrix.shard }}/5)
        env:
          TT_METAL_DIR:  ${{ github.workspace }}/tt-metal
          BUILD_DIR:     ${{ github.workspace }}/tt-metal/build_emule
          TT_EMULE_ARCH: ${{ matrix.arch }}
          SHARD_INDEX:   ${{ matrix.shard }}
          SHARD_COUNT:   5
        shell: bash
        run: bash tt-emule/.github/scripts/ci-ttnn-pytests.sh

      - name: Upload TTNN pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttnn-pytests-results-${{ matrix.arch }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/ttnn-pytests.log
            ${{ runner.temp }}/ttnn-junit-xml/*.xml
          retention-days: 30
          if-no-files-found: warn

  ttnn-pytest-blackhole:
    name: TTNN Pytests (${{ matrix.arch }}, shard ${{ matrix.shard }}/5)
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' && github.event_name != 'pull_request' }}
    runs-on: tt-ubuntu-2204-xlarge-stable
    timeout-minutes: 90
    container:
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [blackhole]
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout tt-emule (PR)
        uses: actions/checkout@v4
        with:
          path: tt-emule

      - name: Checkout tt-metal at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ needs.build.outputs.pin }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: tt-metal-build-${{ github.run_id }}
          path: tt-metal/build_emule/

      - name: Place cluster descriptors
        shell: bash
        run: |
          mkdir -p tt-metal/tt_metal/third_party/umd/tests
          cp -r tt-metal/build_emule/_cluster_descs/cluster_descriptor_examples \
                tt-metal/tt_metal/third_party/umd/tests/

      - name: Install SFPI toolchain
        shell: bash
        run: bash tt-metal/install_dependencies.sh --sfpi

      - name: Run TTNN pytest (${{ matrix.arch }}, shard ${{ matrix.shard }}/5)
        env:
          TT_METAL_DIR:  ${{ github.workspace }}/tt-metal
          BUILD_DIR:     ${{ github.workspace }}/tt-metal/build_emule
          TT_EMULE_ARCH: ${{ matrix.arch }}
          SHARD_INDEX:   ${{ matrix.shard }}
          SHARD_COUNT:   5
        shell: bash
        run: bash tt-emule/.github/scripts/ci-ttnn-pytests.sh

      - name: Upload TTNN pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttnn-pytests-results-${{ matrix.arch }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/ttnn-pytests.log
            ${{ runner.temp }}/ttnn-junit-xml/*.xml
          retention-days: 30
          if-no-files-found: warn

  # Lightweight TTNN gate for pull requests ONLY: the curated blackhole PR_TIER
  # smoke set across 2 parallel shards, replacing the full wormhole+blackhole
  # sharded matrix above. The full suites still run on push to main.
  ttnn-smoke-pr:
    name: TTNN Smoke (blackhole, PR, shard ${{ matrix.shard }}/2)
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' }}
    runs-on: tt-ubuntu-2204-xlarge-stable
    timeout-minutes: 60
    container:
      image: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-24-04:latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout tt-emule (PR)
        uses: actions/checkout@v4
        with:
          path: tt-emule

      - name: Checkout tt-metal at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: tenstorrent/tt-metal
          ref: ${{ needs.build.outputs.pin }}
          path: tt-metal
          fetch-depth: 1
          submodules: false

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: tt-metal-build-${{ github.run_id }}
          path: tt-metal/build_emule/

      - name: Place cluster descriptors
        shell: bash
        run: |
          mkdir -p tt-metal/tt_metal/third_party/umd/tests
          cp -r tt-metal/build_emule/_cluster_descs/cluster_descriptor_examples \
                tt-metal/tt_metal/third_party/umd/tests/

      - name: Install SFPI toolchain
        shell: bash
        run: bash tt-metal/install_dependencies.sh --sfpi

      - name: Run TTNN smoke (blackhole, PR_TIER, shard ${{ matrix.shard }}/2)
        # CI_TIER=pr → run_ttnn_pytests_blackhole.sh runs only its PR_TIER set,
        # round-robin split across 2 shards that run in parallel.
        env:
          TT_METAL_DIR:  ${{ github.workspace }}/tt-metal
          BUILD_DIR:     ${{ github.workspace }}/tt-metal/build_emule
          TT_EMULE_ARCH: blackhole
          CI_TIER:       pr
          SHARD_INDEX:   ${{ matrix.shard }}
          SHARD_COUNT:   2
        shell: bash
        run: bash tt-emule/.github/scripts/ci-ttnn-pytests.sh

      - name: Upload TTNN smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttnn-smoke-pr-results-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/ttnn-pytests.log
            ${{ runner.temp }}/ttnn-junit-xml/*.xml
          retention-days: 30
          if-no-files-found: warn

  # Aggregator gate: a single, statically-named check that succeeds only when
  # every matrix leg above succeeds. Branch protection requires THIS check
  # (instead of the dynamically-named build/test/ttnn-pytest checks), so the
  # required-checks list stays stable as the matrix changes. Because this
  # workflow always runs, this check always reports: on a docs-only change the
  # heavy jobs are 'skipped' (not 'failure') and the gate passes immediately;
  # on a code change it reflects the real regression result.
  all-passed:
    name: All checks passed
    # Run even when a dependency failed/was skipped, so the gate always reports.
    if: ${{ always() }}
    needs: [changes, build, test, ttnn-pytest-wormhole, ttnn-pytest-blackhole, ttnn-smoke-pr]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        # needs.<matrix-job>.result is the aggregate over all legs: success only
        # if every leg succeeded. We fail on failure/cancelled and treat
        # success/skipped as OK: a failed `build` trips this via its own
        # 'failure', and docs-only runs leave build/test/ttnn 'skipped' (OK).
        # `changes` failing (detection error) also trips the gate — fail closed.
        #
        # The on-PR and on-push paths each leave the other's TTNN jobs 'skipped':
        # a pull_request runs ttnn-smoke-pr (the sharded ttnn-pytest-* are
        # skipped); a push runs ttnn-pytest-* (ttnn-smoke-pr is skipped). Both
        # are OK here, so the same single required check ("All checks passed")
        # covers both paths with no branch-protection change.
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed:"
          echo "  changes:     ${{ needs.changes.result }}"
          echo "  build:       ${{ needs.build.result }}"
          echo "  test:        ${{ needs.test.result }}"
          echo "  ttnn-pytest-wormhole: ${{ needs.ttnn-pytest-wormhole.result }}"
          echo "  ttnn-pytest-blackhole: ${{ needs.ttnn-pytest-blackhole.result }}"
          echo "  ttnn-smoke-pr: ${{ needs.ttnn-smoke-pr.result }}"
          exit 1
      - name: All required jobs passed
        run: echo "All required jobs passed."
